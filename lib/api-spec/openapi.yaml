openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: knowledge
    description: Knowledge base and grounded question answering
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /documents:
    get:
      operationId: listDocuments
      tags: [knowledge]
      summary: List knowledge documents
      responses:
        "200":
          description: Current knowledge documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [knowledge]
      summary: Add pasted text or Markdown to the knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Document added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid document
  /documents/upload:
    post:
      operationId: uploadDocument
      tags: [knowledge]
      summary: Upload and extract a supported document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/DocumentUploadInput"
      responses:
        "201":
          description: Document uploaded and indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid or empty document
        "413":
          description: Document is too large
        "415":
          description: Unsupported document format
  /ask:
    post:
      operationId: askKnowledgeBase
      tags: [knowledge]
      summary: Ask a grounded question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "200":
          description: Grounded answer with retrieved sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Answer"
        "400":
          description: Invalid question
        "503":
          description: Language model unavailable
  /knowledge-summary:
    get:
      operationId: getKnowledgeSummary
      tags: [knowledge]
      summary: Summarize the indexed knowledge base
      responses:
        "200":
          description: Knowledge base summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Document:
      type: object
      required: [id, name, content, chunkCount, createdAt, format, sourceType, mimeType, sizeBytes, extractedCharacterCount]
      properties:
        id:
          type: string
        name:
          type: string
        content:
          type: string
        chunkCount:
          type: integer
        createdAt:
          type: string
        format:
          type: string
          enum: [txt, md, pdf, html, docx, xlsx, xls]
        sourceType:
          type: string
          enum: [sample, paste, upload]
        mimeType:
          type: string
        sizeBytes:
          type: integer
        extractedCharacterCount:
          type: integer
    DocumentInput:
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        content:
          type: string
          minLength: 20
          maxLength: 100000
    DocumentUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    QuestionInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 1000
    Source:
      type: object
      required: [documentId, documentName, chunkIndex, excerpt, score]
      properties:
        documentId:
          type: string
        documentName:
          type: string
        chunkIndex:
          type: integer
        excerpt:
          type: string
        score:
          type: number
    Answer:
      type: object
      required: [answer, sources, retrievedChunks, grounded]
      properties:
        answer:
          type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/Source"
        retrievedChunks:
          type: integer
        grounded:
          type: boolean
    KnowledgeSummary:
      type: object
      required: [documentCount, chunkCount, characterCount]
      properties:
        documentCount:
          type: integer
        chunkCount:
          type: integer
        characterCount:
          type: integer

