# AcmeCorp Banking API — nginx TLS configuration
# Last reviewed: 2021-03-15
# Status: PENDING PQC MIGRATION REVIEW

server {
    listen 443 ssl;
    server_name api.acmecorp-banking.com;

    # TLS configuration
    ssl_certificate     /etc/ssl/certs/acmecorp.crt;
    ssl_certificate_key /etc/ssl/private/acmecorp.key;

    # Protocol versions — TLSv1.2 only (TLSv1.3 not yet enabled)
    ssl_protocols TLSv1.2;

    # Cipher suites — RSA + AES-128, ECDHE-RSA preferred
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-SHA256';
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Session resumption
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;

    location /api/ {
        proxy_pass http://localhost:8080;
    }
}

# Legacy internal API — TLS 1.1 still required by some internal clients
server {
    listen 8443 ssl;
    ssl_protocols TLSv1.1 TLSv1.2;
    ssl_ciphers 'AES128-SHA:DES-CBC3-SHA:RC4-SHA';
    ssl_certificate /etc/ssl/certs/internal.crt;
}
